name: Construction d'un projet

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  create-folder:
    name: create-folder
    runs-on: ubuntu-latest
    steps:
      - name: create folder on remote VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: mkdir -p ~/applications/avisClient
  build:
    runs-on: ubuntu-latest
    needs: create-folder
    steps:
    - name: Téléchargement des sources
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -Dmaven.test.skip=true -B package --file pom.xml
    - name: Rename jar
      run: mv target/*.jar target/avisClient.jar
    - name: Copy files via SSH
      uses: appleboy/scp-action@v1
      with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: "target/avisClient.jar"
          target: ~/applications/avisClient
          strip_components: 1
  run-script:
    name: run script
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: create folder on remote VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # 1. Arrêter l'ancien service s'il existe pour éviter les conflits
            sudo /etc/init.d/avisClient stop || true
            
            # 2. Créer le lien symbolique avec les droits sudo (Correction de l'alignement)
            sudo ln -sf /home/${{ secrets.USERNAME }}/applications/avisClient/avisClient.jar /etc/init.d/avisClient
            
            # 3. Rendre le fichier JAR explicitement exécutable par Linux
            chmod +x /home/${{ secrets.USERNAME }}/applications/avisClient/avisClient.jar
            
            # 4. Démarrer le service avec sudo (Correction de l'alignement et des privilèges)
            sudo /etc/init.d/avisClient start