name: Construction d'un projet

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  create-folder:
    name: create-folder
    runs-on: ubuntu-latest
    steps:
      - name: create folder on remote VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: mkdir -p ~/applications/avisClient
  build:
    runs-on: ubuntu-latest
    needs: create-folder
    steps:
    - name: Téléchargement des sources
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -Dmaven.test.skip=true -B package --file pom.xml
    - name: Rename jar
      run: mv target/*.jar target/avisClient.jar
    - name: Copy files via SSH
      uses: appleboy/scp-action@v1
      with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: "target/avisClient.jar"
          target: ~/applications/avisClient
          strip_components: 1
  run-script:
    name: run script
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: create folder on remote VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            # 1. Se déplacer directement dans le répertoire de l'application
            cd ~/applications/avisClient
            
            # 1. On force l'arrêt des anciennes instances (le timeout évite un blocage infini)
            timeout 5s pkill -9 -f avisClient.jar || true
            
            # 2. On lance l'application dans un sous-shell complètement isolé en tâche de fond
            (nohup java -jar avisClient.jar > app.log 2>&1 < /dev/null &)
            
            # 3. On quitte immédiatement le script SSH proprement
            exit 0