name: Construction d'un projet

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  create-folder:
    name: create-folder
    runs-on: ubuntu-latest
    steps:
      - name: create folder on remote VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: mkdir -p ~/applications/avisClient

  build:
    runs-on: ubuntu-latest
    needs: create-folder
    steps:
      - name: Téléchargement des sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -Dmaven.test.skip=true -B package --file pom.xml
      - name: Rename jar
        run: mv target/*.jar target/avisClient.jar
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: "target/avisClient.jar"
          target: ~/applications/avisClient
          strip_components: 1

  run-script:
    name: run script
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Execute script on remote VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          request_pty: true
          # SOLUTION ICI : Force l'action à valider le succès et se couper après 5 secondes au lieu de bloquer indéfiniment
          command_timeout: 5s
          script: |
            cd ~/applications/avisClient
            
            # 1. Arrêter l'ancienne version proprement (sans sudo)
            pkill -f avisClient.jar || true
            
            # 2. Rendre le fichier JAR explicitement exécutable
            chmod +x avisClient.jar
            
            # 3. Lancer le JAR directement (Méthode du Tuto sans sudo) en coupant les entrées/sorties
            nohup ./avisClient.jar > app.log 2>&1 < /dev/null &
            
            # 4. Petite pause pour laisser le processus s'enregistrer
            sleep 2
